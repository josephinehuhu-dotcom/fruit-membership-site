<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'"
  />
  <meta name="referrer" content="same-origin" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>鲜享 · 领取数据管理</title
  ><style>
    :root {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #233b30;
      background: #f6f7f2;
      font-synthesis: none;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    button,
    input,
    select {
      font: inherit;
    }
    button,
    a {
      touch-action: manipulation;
    }
    button {
      cursor: pointer;
      border: 1px solid #dbe2d8;
      border-radius: 10px;
      background: white;
      padding: 10px 16px;
      color: inherit;
    }
    button:hover {
      background: #edf3e9;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    a {
      color: inherit;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e1e7dd;
      padding: 20px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .brand span {
      color: #769957;
    }
    nav {
      display: flex;
      gap: 8px;
    }
    nav a {
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 9px;
      font-size: 14px;
    }
    nav a.active {
      background: #224d36;
      color: white;
    }
    main {
      max-width: 1200px;
      margin: 36px auto;
      padding: 0 24px;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 3px;
      color: #6c8860;
      font-weight: 700;
    }
    h1 {
      font-size: 32px;
      margin: 12px 0;
    }
    h2 {
      font-size: 20px;
      margin: 0 0 16px;
    }
    p {
      color: #788276;
      line-height: 1.8;
    }
    .notice {
      font-size: 12px;
      background: #edf1e6;
      padding: 10px 16px;
      border-radius: 8px;
      color: #68775b;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }
    .card {
      background: white;
      border: 1px solid #e1e7dd;
      border-radius: 20px;
      padding: 28px;
    }
    .hero {
      background: #e6edda;
      position: relative;
      overflow: hidden;
      min-height: 460px;
      padding: 40px;
    }
    .hero h1 {
      font-size: 44px;
      line-height: 1.3;
      position: relative;
      z-index: 1;
    }
    .hero p {
      max-width: 270px;
      color: #657953;
    }
    .fruit {
      font-size: 125px;
      position: absolute;
      bottom: 30px;
      right: 35px;
      transform: rotate(-12deg);
      filter: drop-shadow(0 16px 15px #4b643322);
    }
    label {
      display: block;
      font-size: 13px;
      margin: 18px 0 8px;
      color: #65735f;
    }
    select,
    input {
      width: 100%;
      background: #fafbf8;
      border: 1px solid #dae2d6;
      padding: 12px;
      border-radius: 9px;
      color: inherit;
    }
    .quota {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin: 26px 0 14px;
    }
    .quota strong {
      font-size: 48px;
    }
    .quota small {
      font-size: 16px;
      color: #8b9484;
    }
    .dots {
      display: flex;
      gap: 8px;
    }
    .dots i {
      height: 9px;
      background: #e8eddf;
      flex: 1;
      border-radius: 9px;
    }
    .dots i.used {
      background: #668f48;
    }
    .primary {
      background: #234d36;
      color: #fff;
      border: 0;
      width: 100%;
      padding: 15px;
      margin-top: 24px;
    }
    .primary:hover {
      background: #326c49;
    }
    .message {
      padding: 12px;
      background: #edf5e8;
      color: #376132;
      border-radius: 9px;
      margin-top: 14px;
      line-height: 1.6;
      font-size: 14px;
    }
    .muted {
      font-size: 12px;
      color: #8b9484;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin: 25px 0;
    }
    .stat {
      padding: 22px;
    }
    .stat strong {
      display: block;
      font-size: 34px;
      margin: 10px 0 0;
    }
    .stat span {
      font-size: 13px;
      color: #7b8874;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    .toolbar input {
      flex: 1;
      min-width: 160px;
    }
    .toolbar select {
      width: auto;
    }
    .tablewrap {
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
      font-size: 14px;
    }
    th {
      text-align: left;
      color: #86907e;
      font-weight: 500;
      background: #f8faf5;
    }
    td,
    th {
      padding: 16px 12px;
      border-bottom: 1px solid #edf0e8;
    }
    .pill {
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      background: #eaf3e3;
      color: #618244;
    }
    .pill.full {
      background: #fff0d6;
      color: #a87624;
    }
    .tabs {
      display: flex;
      gap: 8px;
    }
    .tabs .active {
      border-color: #527249;
      background: #edf3e8;
    }
    .empty {
      padding: 32px;
      text-align: center;
      color: #8b9484;
    }
    .history {
      margin-top: 25px;
      border-top: 1px solid #edf0e8;
      padding-top: 20px;
    }
    .history div {
      font-size: 13px;
      padding: 9px 0;
      display: flex;
      justify-content: space-between;
    }
    footer {
      text-align: center;
      font-size: 12px;
      color: #99a08f;
      margin: 35px;
    }
    .topactions {
      display: flex;
      gap: 8px;
    }
    dialog {
      border: 1px solid #dde5d5;
      border-radius: 18px;
      padding: 28px;
      max-width: 450px;
      width: 90%;
    }
    dialog::backdrop {
      background: #152a2466;
    }
    @media (max-width: 720px) {
      header {
        padding: 16px;
      }
      .brand {
        font-size: 19px;
      }
      nav a {
        padding: 9px;
      }
      main {
        margin: 22px auto;
        padding: 0 16px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .hero {
        min-height: 225px;
        padding: 24px;
      }
      .hero h1 {
        font-size: 30px;
      }
      .hero p {
        max-width: 190px;
        font-size: 13px;
      }
      .fruit {
        font-size: 90px;
        right: 14px;
        bottom: 18px;
      }
      .card {
        padding: 22px;
      }
      .stats {
        grid-template-columns: 1fr 1fr;
      }
      .row {
        align-items: start;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 27px;
      }
      .topactions {
        flex-wrap: wrap;
      }
    }
    textarea {
      width: 100%;
      min-height: 140px;
      padding: 12px;
      border: 1px solid #dae2d6;
      border-radius: 9px;
      font: inherit;
    }
    input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
    }
    .auth {
      max-width: 450px;
      margin: 40px auto;
    }
    .error {
      color: #a2362d;
      background: #fff0ec;
      padding: 12px;
      border-radius: 8px;
      margin: 12px 0;
    }
    .toolbar button {
      white-space: nowrap;
    }
    .stat strong {
      font-size: 32px;
    }
    .receipt {
      border: 1px solid #bfd6b0;
      background: #f1f8ec;
      padding: 20px;
      border-radius: 12px;
      margin: 18px 0;
    }
    .small {
      font-size: 12px;
    }
    td button {
      padding: 6px 8px;
      font-size: 12px;
    }
    details {
      margin: 20px 0;
    }
    summary {
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .phone {
      font-variant-numeric: tabular-nums;
    }
  </style>
  <header>
    <div class="brand">◒ 鲜享<span>会员</span></div>
    <span class="muted" id="pageLabel">管理员工作台</span>
  </header>
  <main id="app"></main>
  <footer>鲜享会员 · 每月四份新鲜心意</footer>
  <script src="config.js"></script>
  <script src="qrcode.js"></script>
  <script src="app.js"></script>
</html>
